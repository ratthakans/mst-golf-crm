services:
  postgres:
    image: postgres:16-alpine
    container_name: golffy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: golffy
      POSTGRES_PASSWORD: golffy
      POSTGRES_DB: golffy
    ports:
      - "5432:5432"
    volumes:
      - golffy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golffy -d golffy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: golffy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - golffy-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  golffy-pgdata:
  golffy-redisdata:

# Daily encrypted pg_dump of the production schema into a private Vercel Blob
# store, 30 days kept (docs/PRODUCT.md §4.4).
# Repo secrets: DATABASE_URL_UNPOOLED, BACKUP_BLOB_TOKEN (read-write token of a
# PRIVATE Blob store used only for backups), BACKUP_PASSPHRASE.
# Restore: download, `openssl enc -d -aes-256-cbc -pbkdf2 -in f.sql.gz.enc | gunzip | psql <url>`.
name: backup
on:
  schedule:
    - cron: "0 20 * * *" # 03:00 Bangkok
  workflow_dispatch: {}
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          BACKUP_BLOB_TOKEN: ${{ secrets.BACKUP_BLOB_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ] || [ -z "$BACKUP_BLOB_TOKEN" ] || [ -z "$BACKUP_PASSPHRASE" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Backup secrets not set — skipping"; fi
      - name: Install pg_dump 17
        if: steps.check.outputs.skip != '1'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump, encrypt, upload
        if: steps.check.outputs.skip != '1'
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          BACKUP_BLOB_TOKEN: ${{ secrets.BACKUP_BLOB_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          FILE="mst-golf-$(date -u +%Y%m%dT%H%M%SZ).sql.gz.enc"
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL_UNPOOLED" --schema=public --no-owner --no-privileges \
            | gzip -9 | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE -out "$FILE"
          ls -lh "$FILE"
          npm i --no-save @vercel/blob@2.8.0 >/dev/null
          node scripts/backup-upload.mjs "$FILE"

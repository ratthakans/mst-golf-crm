# Checks on every push and pull request: typecheck, lint, unit tests, and the
# database integration tests when a test database is configured.
# Optional repo secret: DATABASE_URL_TEST — a Neon connection string; the tests
# run in the throwaway "test_core" schema (reset every run), never "public".
name: ci
on:
  push:
    branches: ["**"]
  pull_request: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Lint
        run: pnpm -r --if-present lint
      - name: Unit tests
        run: pnpm --filter @mstgolf/core --filter @mstgolf/shared test
      - name: Check for the test database
        id: db
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
        run: if [ -n "$DATABASE_URL_TEST" ]; then echo "on=1" >> "$GITHUB_OUTPUT"; else echo "DATABASE_URL_TEST not set — skipping database tests"; fi
      - name: Database tests (test_core schema)
        if: steps.db.outputs.on == '1'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          DATABASE_SCHEMA: test_core
        run: |
          pnpm test:db
          pnpm --filter @mstgolf/database test
